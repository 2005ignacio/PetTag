<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetTag</title>

<style>
  /* ================================================================
     🎨 COLORES Y ESTILOS GENERALES DE LA PLANTILLA
     ================================================================
     Estos son los ÚNICOS lugares donde hay que tocar código para
     cambiar la paleta de colores de la landing. Cada variable se
     usa en una parte puntual de la página (te lo indico al lado
     de cada una). Para una mascota nueva normalmente NO hace falta
     tocar esto, salvo que quieras que esa landing tenga otros colores.
     ================================================================ */
  :root{
    --color-fondo: #cddd91;          /* Fondo de toda la página y fondo de los bloques "Dueño/Zona" */
    --color-tarjeta: #FFFFFF;        /* Fondo de la tarjeta blanca central */

    --color-primario: #A7C7E7;          /* Color del botón "LLAMAR" */
    --color-primario-oscuro: #5990c4;   /* (Reservado para variantes/hover del botón Llamar) */

    --color-secundario: #75e25a;        /* Color del botón "WHATSAPP" */
    --color-secundario-oscuro: #8FCBA5; /* (Reservado para variantes/hover del botón WhatsApp) */

    --color-texto: #3A3A3A;          /* Color de texto principal (nombre, descripciones, etc.) */
    --color-texto-suave: #3b3b3b;    /* Color de texto secundario (más clarito, para detalles) */

    --color-alerta-fondo: #cddd91;   /* Fondo del cuadro "⚠️ Información importante" */
    --color-alerta-borde: #ff2600;   /* Borde del cuadro "⚠️ Información importante" */

    --color-promo-fondo: #cfaf95;    /* Fondo del cuadro final "¿Querés esto para tu mascota?" */
    --color-promo-borde: #492814;    /* Borde y botones del cuadro final */

    --radio: 20px;                   /* Redondeado general de tarjetas y cuadros */
    --sombra: 0 8px 24px rgba(0,0,0,0.08); /* Sombra de la tarjeta principal */
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    padding: 0;
    background: var(--color-fondo);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--color-texto);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 20px 12px;
  }

  .tarjeta{
    background: var(--color-tarjeta);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    max-width: 420px;
    width: 100%;
    padding: 24px 20px 32px;
    text-align: center;
  }

  .foto-wrap{
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: var(--color-fondo);
    margin-bottom: 16px;
  }

  .foto-wrap img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .nombre-mascota{
    font-size: 1.8rem;
    font-weight: 700;
    margin: 4px 0 8px;
  }

  .mensaje-principal{
    font-size: 1rem;
    color: var(--color-texto-suave);
    margin: 0 0 20px;
    line-height: 1.4;
  }

  .datos{
    text-align: left;
    background: var(--color-fondo);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }

  .dato-fila{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 0.95rem;
  }

  .dato-icono{
    font-size: 1.1rem;
    width: 22px;
    text-align: center;
    flex-shrink: 0;
  }

  .dato-label{
    color: var(--color-texto-suave);
    margin-right: 4px;
  }

  .botones{
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }

  .boton{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 15px 16px;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    text-decoration: none;
    color: #2B2B2B;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }

  .boton:active{
    transform: scale(0.97);
    opacity: 0.9;
  }

  .boton-llamar{
    background: var(--color-primario);
  }

  .boton-whatsapp{
    background: var(--color-secundario);
  }

  .seccion{
    text-align: left;
    margin-bottom: 18px;
  }

  .seccion h2{
    font-size: 1rem;
    margin: 0 0 6px;
  }

  .seccion p{
    font-size: 0.92rem;
    color: var(--color-texto-suave);
    line-height: 1.5;
    margin: 0;
  }

  .alerta{
    text-align: left;
    background: var(--color-alerta-fondo);
    border: 1px solid var(--color-alerta-borde);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }

  .alerta h2{
    font-size: 0.95rem;
    margin: 0 0 6px;
  }

  .alerta p{
    font-size: 0.9rem;
    color: var(--color-texto);
    line-height: 1.5;
    margin: 0;
  }

  /* ---------------------------------------------------------------
     Cuadro final: "¿Querés esto para tu mascota?"
     Acá se presenta el producto (PetTag) y los dos botones que
     llevan a Instagram (consultas y perfil).
     --------------------------------------------------------------- */
  .promo{
    text-align: left;
    background: var(--color-promo-fondo);
    border: 1px solid var(--color-promo-borde);
    border-radius: 14px;
    padding: 16px 16px 18px;
  }

  .promo h2{
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 8px;
    color: var(--color-texto);
  }

  .promo p{
    font-size: 0.9rem;
    color: var(--color-texto-suave);
    line-height: 1.5;
    margin: 0 0 16px;
  }

  .promo-botones{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .promo-boton{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 14px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 700;
    text-decoration: none;
    color: var(--color-texto);
    background: var(--color-tarjeta);
    border: 1.5px solid var(--color-promo-borde);
    transition: transform 0.1s ease, opacity 0.15s ease;
  }

  .promo-boton svg{
    flex-shrink: 0;
  }

  .promo-boton:active{
    transform: scale(0.97);
    opacity: 0.9;
  }
</style>
</head>
<body>

<div class="tarjeta">

  <div class="foto-wrap">
    <img id="foto-mascota" src="" alt="Foto de la mascota">
  </div>

  <h1 class="nombre-mascota" id="nombre-mascota"></h1>
  <p class="mensaje-principal" id="mensaje-principal"></p>

  <div class="datos">
    <div class="dato-fila">
      <span class="dato-icono">👤</span>
      <span class="dato-label">Dueño:</span>
      <span id="dato-dueno"></span>
    </div>
    <div class="dato-fila">
      <span class="dato-icono">📍</span>
      <span class="dato-label">Zona:</span>
      <span id="dato-zona"></span>
    </div>
  </div>

  <div class="botones">
    <a id="btn-llamar" class="boton boton-llamar" href="#">📞 LLAMAR</a>
    <a id="btn-whatsapp" class="boton boton-whatsapp" href="#" target="_blank" rel="noopener">💬 WHATSAPP</a>
  </div>

  <div class="seccion">
    <h2 id="titulo-sobre"></h2>
    <p id="texto-descripcion"></p>
  </div>

  <div class="alerta">
    <h2>⚠️ Información importante</h2>
    <p id="texto-importante"></p>
  </div>

  <!-- Cuadro final: presenta el producto PetTag y los links de Instagram -->
  <div class="promo">
    <h2 id="promo-titulo">¿Querés esto para tu mascota?</h2>
    <p id="promo-texto"></p>

    <div class="promo-botones">
      <a id="promo-btn-consulta" class="promo-boton" href="#" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="4.3" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/>
        </svg>
        Escribinos para pedir la tuya
      </a>

      <a id="promo-btn-seguir" class="promo-boton" href="#" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="4.3" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/>
        </svg>
        Seguinos en Instagram
      </a>
    </div>
  </div>

</div>


<script>
/* ==========================================================
   DATOS DE LA MASCOTA — EDITAR SOLO ESTA SECCIÓN
   ==========================================================
   Para crear una landing nueva para otra mascota,
   solo hay que cambiar los valores de este objeto.
   El resto del código NO necesita modificarse.
   ========================================================== */

const mascota = {

  // CAMBIAR AQUÍ EL NOMBRE DE LA MASCOTA
  nombre: "Rocky",

  // CAMBIAR AQUÍ EL NOMBRE DEL DUEÑO
  dueno: "Belkis Lauxmann",

  // CAMBIAR AQUÍ EL NÚMERO DE TELÉFONO PARA LLAMADAS
  // Formato recomendado: código de país + área + número, sin espacios ni símbolos
  // Ejemplo: 5493425551234
  telefono: "5493404523284",

  // CAMBIAR AQUÍ EL NÚMERO DE WHATSAPP
  // Mismo formato que el teléfono (sin +, sin espacios)
  whatsapp: "5493404523284",

  // CAMBIAR AQUÍ LA ZONA O UBICACIÓN
  zona: "San Jeronimo Norte, Santa Fe, Argentina",

  // CAMBIAR AQUÍ LA URL O NOMBRE DE ARCHIVO DE LA FOTO
  // Puede ser un archivo local (ej: "lucas.jpg") ubicado junto a este index.html,
  // o una URL completa (ej: "https://miweb.com/lucas.jpg")
  foto: "2-rocky.jpg",

  // CAMBIAR AQUÍ LA DESCRIPCIÓN DE LA MASCOTA
  descripcion: "El rocky es un perro muy amigable y tranquilo. Tiene pelaje marrón clarito.",

  // CAMBIAR AQUÍ LA INFORMACIÓN IMPORTANTE O ADVERTENCIAS
  informacionImportante: "Puede estar asustado. Pueden acariciarlo sin problema.",

  // ------------------------------------------------------------
  // CUADRO FINAL "¿Querés esto para tu mascota?"
  // Estos 3 campos casi nunca cambian de una mascota a otra
  // (son datos del negocio, no de la mascota), pero están acá
  // por si en algún momento los querés personalizar.
  // ------------------------------------------------------------

  // Texto que explica el producto en el cuadro final
  textoProducto: "Este producto se llama PetTag, como podés ver es un llavero inteligente que funciona como una herramienta por si tu mascota se llega a perder.",

  // Link del botón "Escribinos para pedir la tuya"
  // (va directo al chat de Instagram de cotiva.ar)
  instagramConsulta: "https://ig.me/m/cotiva.ar",

  // Link del botón "Seguinos en Instagram"
  // (va al perfil de Instagram de cotiva.ar)
  instagramPerfil: "https://www.instagram.com/cotiva.ar/"

};

/* ==========================================================
   FIN DE LA SECCIÓN EDITABLE
   A partir de acá el código arma la página automáticamente
   usando los datos definidos arriba. No hace falta tocar nada.
   ========================================================== */

document.getElementById("foto-mascota").src = mascota.foto;
document.getElementById("foto-mascota").alt = "Foto de " + mascota.nombre;

document.getElementById("nombre-mascota").textContent = "🐶 " + mascota.nombre.toUpperCase();

document.getElementById("mensaje-principal").textContent =
  "Si encontraste a " + mascota.nombre + ", por favor contactá a su dueño.";

document.getElementById("dato-dueno").textContent = mascota.dueno;
document.getElementById("dato-zona").textContent = mascota.zona;

document.getElementById("titulo-sobre").textContent = "Sobre " + mascota.nombre;
document.getElementById("texto-descripcion").textContent = mascota.descripcion;

document.getElementById("texto-importante").textContent = mascota.informacionImportante;

// Botón de llamada telefónica
document.getElementById("btn-llamar").href = "tel:+" + mascota.telefono;

// Botón de WhatsApp con mensaje predefinido
const mensajeWhatsapp = encodeURIComponent(
  "Hola, encontré a " + mascota.nombre + "."
);
document.getElementById("btn-whatsapp").href =
  "https://wa.me/" + mascota.whatsapp + "?text=" + mensajeWhatsapp;

// Cuadro final: texto del producto y los dos botones de Instagram
document.getElementById("promo-texto").textContent = mascota.textoProducto;
document.getElementById("promo-btn-consulta").href = mascota.instagramConsulta;
document.getElementById("promo-btn-seguir").href = mascota.instagramPerfil;

</script>

</body>
</html>
